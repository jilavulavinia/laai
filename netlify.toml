# Plain HTML site: nothing to build, publish the repository root.
[build]
  publish = "."

# Images, video and PDFs rarely change: let browsers cache them for a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    # Hidden from search engines for now; delete this line to go public.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
